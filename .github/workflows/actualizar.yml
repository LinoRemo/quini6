name: Actualizar sorteo

on:
  schedule:
    # Sorteos: miércoles y domingo a la noche (Argentina, UTC-3) = jueves y lunes de madrugada en UTC
    - cron: "30 1,3,5,11 * * 1,4"
    # Control diario por si el extracto se publicó tarde
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar.js
      - name: Guardar si hay sorteo nuevo
        run: |
          if git diff --quiet -- data/sorteos.json; then exit 0; fi
          git config user.name "quini6-bot"
          git config user.email "quini6-bot@users.noreply.github.com"
          git add data/sorteos.json
          git commit -m "Sorteo actualizado"
          git push
